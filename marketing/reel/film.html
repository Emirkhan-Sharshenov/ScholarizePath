<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ScholarizePath — Film</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--brand:#0058bd;--ink:#0a1a3f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
body{font-family:Inter,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
#light{position:absolute;inset:0;pointer-events:none}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.layer{position:absolute;inset:0}
.persp{position:absolute;inset:0;perspective:2400px;perspective-origin:50% 45%}
/* ---------- titles */
.ttl{position:absolute;left:40px;right:40px;top:230px;text-align:center;color:#f5f5f7;display:none}
.ttl .a,.ttl .b{display:block;font:800 92px/1.04 Manrope;letter-spacing:-.04em;will-change:transform,opacity,filter}
.ttl .b{background:linear-gradient(90deg,#6aa8ff,#b9d6ff 55%,#ffd9a0);-webkit-background-clip:text;background-clip:text;color:transparent}
.ttl.big .a{font:800 120px 'Plus Jakarta Sans';letter-spacing:-.04em}
.ttl.big .b{font:600 44px Inter;letter-spacing:-.01em;margin-top:18px;background:none;color:#a1a1a6}
/* ---------- laptop */
#laptop{position:absolute;left:90px;top:690px;width:900px;transform-style:preserve-3d}
#lid{position:relative;width:900px;height:580px;transform-origin:50% 100%;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:30px;backface-visibility:hidden}
#lidFront{background:#07080b;padding:22px 22px 26px;box-shadow:inset 0 0 0 2px #3a3f4b,0 0 0 1px rgba(255,255,255,.08)}
#lidFront .cam{position:absolute;top:8px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#1f2937}
#screen{position:relative;width:100%;height:100%;border-radius:10px;overflow:hidden;background:#f7f9fc}
#glare{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 40%)}
#lidBack{transform:rotateY(180deg);background:linear-gradient(160deg,#4a4f59,#23262d)}
#base{position:relative;width:1000px;margin-left:-50px;height:34px;border-radius:4px 4px 30px 30px;background:linear-gradient(180deg,#8a919c 0%,#4b5059 55%,#2a2d33 100%)}
#base .notch{position:absolute;left:50%;top:0;width:150px;height:12px;margin-left:-75px;border-radius:0 0 12px 12px;background:#3a3e46}
/* ---------- phone */
#phone{position:absolute;left:370px;top:760px;width:340px;height:700px;transform-style:preserve-3d}
#phoneFront,#phoneBack{position:absolute;inset:0;border-radius:58px;backface-visibility:hidden}
#phoneFront{background:#0b0c10;padding:13px;box-shadow:inset 0 0 0 3px #4a4f5b,inset 0 0 0 6px #111318}
#phoneBack{transform:rotateY(180deg);background:linear-gradient(150deg,#3b3f48,#15171c);box-shadow:inset 0 0 0 3px #555b67}
#phoneBack .lens{position:absolute;left:26px;top:26px;width:120px;height:120px;border-radius:34px;background:#1c1f25;box-shadow:inset 0 0 0 2px #3b404a}
#pscreen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:#f7f9fc}
#island{position:absolute;top:12px;left:50%;width:100px;height:28px;margin-left:-50px;border-radius:16px;background:#000;z-index:5}
#pglare{position:absolute;inset:0;border-radius:46px;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.22),rgba(255,255,255,0) 40%)}
.pg{position:absolute;left:0;top:0;transform-origin:0 0}
/* ---------- desktop pages (authored 1440 wide) */
.desk{width:1440px;min-height:896px;background:#f7f9fc;overflow:hidden}
.nav{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 64px;background:rgba(255,255,255,.85);border-bottom:1px solid rgba(226,232,240,.7)}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font:800 20px 'Plus Jakarta Sans';letter-spacing:-.02em;display:block}.brand small{font:500 8px Inter;display:block;margin-top:2px}
.navr{display:flex;gap:12px;align-items:center;font:500 14px Inter}
.btn{height:40px;display:inline-flex;align-items:center;gap:8px;padding:0 18px;border-radius:10px;font:600 14px Inter}
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#eaf2ff,#f3f7ff 60%,#f7f9fc);padding:80px 64px 96px;display:grid;grid-template-columns:7fr 5fr;gap:40px;align-items:center}
.hero .dots{position:absolute;inset:0;opacity:.35;background-image:radial-gradient(#0058bd 1px,transparent 1px);background-size:24px 24px;-webkit-mask-image:linear-gradient(to bottom,#000,transparent)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #dbeafe;background:#fff;border-radius:999px;padding:4px 12px;font:600 12px Inter;color:var(--brand)}
.h1{margin-top:20px;font:700 56px/1.12 'Plus Jakarta Sans';letter-spacing:-.025em}
.gl{background:linear-gradient(90deg,#0058bd,#2f7cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin-top:20px;max-width:576px;font:400 18px/1.6 Inter;color:#475569}
.pc{display:flex;align-items:center;gap:16px;border:1px solid rgba(226,232,240,.8);background:#fff;border-radius:16px;padding:20px;box-shadow:0 12px 28px rgba(10,26,63,.08)}
.pc .ic,.tile{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pc .e{font:600 11px Inter;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8}.pc .t{font:600 16px 'Plus Jakarta Sans';margin-top:2px}.pc .p{font:400 14px Inter;color:#64748b;margin-top:2px}
.stats{margin:-32px 64px 0;position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;border:1px solid rgba(226,232,240,.8);background:#fff;border-radius:16px;padding:16px}
.stats li{list-style:none;display:flex;align-items:center;gap:12px;padding:12px}.stats b{display:block;font:700 20px 'Plus Jakarta Sans'}.stats span{font:500 14px Inter;color:#64748b}
.app{display:grid;grid-template-columns:250px 1fr;height:896px}
.side{background:#fff;border-right:1px solid #eef2f7;padding:22px 16px}
.side .it{display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;border-radius:12px;font:500 15px Inter;color:#475569;margin-top:4px}
.side .it.on{background:#eff6ff;color:var(--brand);font-weight:600}
.main{padding:30px 36px;overflow:hidden}
.main h1{font:700 30px 'Plus Jakarta Sans';letter-spacing:-.02em}.main .sub{font:400 15px Inter;color:#64748b;margin-top:4px}
.card{background:#fff;border:1px solid rgba(226,232,240,.8);border-radius:24px;box-shadow:0 4px 12px rgba(10,26,63,.04)}
.col{background:#f1f5f9;border-radius:20px;padding:12px;min-height:600px}
.col h5{display:flex;align-items:center;gap:8px;font:600 14px Inter;color:#334155;margin:4px 4px 12px}
.col h5 i{width:9px;height:9px;border-radius:50%;display:inline-block}.col h5 em{margin-left:auto;font-style:normal;color:#94a3b8;font-weight:500}
.tc{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 6px rgba(10,26,63,.04)}
.tc b{display:block;font:600 14px/1.3 'Plus Jakarta Sans'}.tc span{display:block;font:400 12px Inter;color:#64748b;margin-top:4px}
.chip{display:inline-block;margin-top:10px;border-radius:999px;padding:3px 10px;font:600 11px Inter}
/* ---------- mobile pages (authored 390 wide) */
.mob{width:390px;height:844px;background:#f7f9fc;overflow:hidden;position:relative}
.mtop{height:100px;padding:50px 16px 0;display:flex;align-items:center;gap:12px;background:#fff;border-bottom:1px solid #eef2f7}
.vio{width:40px;height:40px;border-radius:12px;background:#f5f3ff;color:#7c3aed;display:flex;align-items:center;justify-content:center}
.msg{margin:14px 14px 0}
.ub{margin-left:auto;max-width:280px;background:var(--brand);color:#fff;border-radius:20px 20px 6px 20px;padding:12px 14px;font:500 14px/1.45 Inter}
.ab{max-width:330px;background:#fff;border:1px solid #eef2f7;border-radius:20px 20px 20px 6px;padding:12px 14px;font:400 14px/1.5 Inter;color:#1e293b}
.li{position:relative;display:flex;gap:12px;align-items:flex-start;border:1px solid rgba(226,232,240,.8);background:#fff;border-radius:16px;padding:12px;margin-top:8px}
.mono{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font:700 12px 'Plus Jakarta Sans';color:#fff;flex-shrink:0;background:linear-gradient(135deg,#7c3aed,#0058bd)}
.li b{display:block;font:600 14px/1.3 Inter;color:var(--ink)}.li .v{font:600 13px Inter;color:#6d28d9;margin-top:3px}.li .m{font:400 12px Inter;color:#64748b;margin-top:2px}
.inbar{position:absolute;left:12px;right:12px;bottom:26px;height:52px;border-radius:16px;border:1px solid #e2e8f0;background:#fff;display:flex;align-items:center;gap:10px;padding:0 8px 0 14px;font:400 14px Inter;color:#94a3b8}
.inbar .sb{margin-left:auto;width:38px;height:38px;border-radius:12px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center}
.fp{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font:600 12px Inter}
.cov{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.cv{display:flex;align-items:center;gap:8px;border-radius:14px;padding:10px;font:600 13px Inter}
.cr{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid #f1f5f9;font:400 13px Inter;color:#475569}
.cr b{display:block;font:600 13px Inter;color:var(--ink)}
/* ---------- map + stack */
#mapScene{position:absolute;inset:0;perspective:1400px;perspective-origin:50% 38%;opacity:0;display:none}
#mapPlane{position:absolute;left:-460px;top:560px;width:2000px;height:1000px;transform-style:preserve-3d;transform-origin:50% 50%}
#mapPlane canvas{position:absolute;inset:0}
.beam{position:absolute;width:6px;height:200px;margin-left:-3px;transform-origin:50% 100%;background:linear-gradient(to top,rgba(255,214,140,1),rgba(255,214,140,0));border-radius:3px;box-shadow:0 0 18px rgba(255,200,120,.8)}
.blab{position:absolute;transform-origin:50% 100%;white-space:nowrap;font:700 34px Inter;color:#fff;padding:8px 18px;border-radius:999px;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.3);backdrop-filter:blur(6px)}
#stackScene{position:absolute;inset:0;perspective:2200px;perspective-origin:50% 40%;display:none}
#stack{position:absolute;left:170px;top:640px;width:740px;height:1040px;transform-style:preserve-3d;transform-origin:50% 50%}
.sl{position:absolute;left:0;width:740px;transform-style:preserve-3d}
.sc{border:1px solid rgba(226,232,240,.8);background:#fff;border-radius:28px;padding:22px 24px;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.sc h3{margin-top:12px;font:600 24px/1.3 'Plus Jakarta Sans'}.sc .m{margin-top:4px;font:400 17px Inter;color:#64748b}
.sc .am{margin-top:14px;border-radius:18px;background:#f8fafc;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:400 15px Inter}
.lv{border:1px solid #e2e8f0;background:#fff;border-radius:8px;padding:2px 10px;font:400 14px Inter;color:#475569}
/* ---------- end card */
#endc{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;color:#f5f5f7}
#endc .nm{margin-top:48px;font:800 104px 'Plus Jakarta Sans';letter-spacing:-.04em}
#endc .u{margin-top:26px;font:500 40px Inter;color:#a1a1a6}
#black{position:absolute;inset:0;background:#000;pointer-events:none}
</style>
</head>
<body>
<div id="stage">
 <canvas id="light" width="1080" height="1920"></canvas>
 <div id="mapScene"><div id="mapPlane"><canvas id="mapc" width="2000" height="1000"></canvas></div></div>
 <div id="stackScene"><div id="stack"></div></div>
 <div class="persp" id="devs">
  <div id="laptop"><div id="lid">
    <div class="face" id="lidFront"><div class="cam"></div><div id="screen"><div class="pg" id="dHome"></div><div class="pg" id="dDash"></div><div class="pg" id="dTrack"></div><div id="glare"></div></div></div>
    <div class="face" id="lidBack"></div></div>
   <div id="base"><div class="notch"></div></div></div>
  <div id="phone"><div id="phoneFront"><div id="pscreen"><div id="island"></div><div class="pg" id="mAI"></div><div class="pg" id="mDet"></div><div id="pglare"></div></div></div><div id="phoneBack"><div class="lens"></div></div></div>
 </div>
 <div id="titles"></div>
 <div id="endc"></div>
 <div id="black"></div>
</div>
<script src="dots.js"></script>
<script>

const TT={

const ENDU={en:'Free at scholarizepath.xyz',ru:'Бесплатно на scholarizepath.xyz'}[LANG];

const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,x)=>a+(b-a)*x;
const E={lin:x=>x,out:x=>1-Math.pow(1-x,3),out5:x=>1-Math.pow(1-x,5),in:x=>x*x*x,inOut:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 io:x=>x<.5?8*x*x*x*x:1-Math.pow(-2*x+2,4)/2,sine:x=>-(Math.cos(Math.PI*x)-1)/2,back:x=>{const c1=1.3,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}};
const P=(t,a,b,e=E.out)=>t<=a?0:t>=b?1:e((t-a)/(b-a));
const I={cap:'<path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>',

 trend:'<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',pin:'<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
 arrow:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>',search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',

 scale:'<path d="m16 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="m2 16 3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1Z"/><path d="M7 21h10"/><path d="M12 3v18"/><path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>',
 clip:'<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4M12 16h4M8 11h.01M8 16h.01"/>',

// ======================= screens =======================

  const x3=c3.offsetLeft,y3=c3.offsetTop,x4=c4.offsetLeft,y4=c4.offsetTop+c4.firstElementChild.offsetHeight+10;
  const mvp=P(t,28.1,28.9,E.io),lift=Math.sin(mvp*Math.PI);const W=c3.offsetWidth;
  mover.style.left=lerp(x3,x4,mvp)+'px';mover.style.top=(lerp(y3,y4,mvp)-lift*40)+'px';mv.style.width=W+'px';
  mv.style.transform=`rotate(${lift*4}deg) scale(${1+lift*.06})`;mv.style.boxShadow=`0 ${4+lift*30}px ${10+lift*40}px rgba(10,26,63,${.06+lift*.18})`;
  const done=mvp>=1;const ch=mv.querySelector('.chip');ch.textContent=done?'Accepted 🎉':'Waiting for result';ch.style.background=done?'#ecfdf5':'#fffbeb';ch.style.color=done?'#047857':'#b45309';
  mv.style.borderColor=done?`rgba(16,185,129,${1-P(t,29.6,30.4)*.6})`:'#e2e8f0';mv.style.outline=done?`${3*(1-P(t,29.4,30.4))}px solid rgba(16,185,129,.35)`:'none';
  $('tcnt3').textContent=done?'0':'1';$('tcnt4').textContent=done?'2':'1';[0,1,2].forEach(i=>$('tcnt'+i).textContent=[1,2,1][i]);}
 // floor reflection light under the laptop
 glow(540,1330+L.y*.3,420,'rgba(90,150,255,A)',.25*L.o*(t<8.7||t>26?1:0));

 // ---- 3D map
 const ms=$('mapScene');const mOn=t>8.3&&t<13.1;ms.style.display=mOn?'block':'none';
 if(mOn){const lt=t-8.3;ms.style.opacity=P(t,8.35,8.85)*(1-P(t,12.5,13.1));drawMap(lt);
  const pan=E.sine(clamp(lt/4.8));$('mapPlane').style.transform=`translate3d(${lerp(420,-420,pan)}px,${lerp(-80,20,pan)}px,${lerp(700,0,E.out5(clamp(lt/1.2)))}px) rotateX(${lerp(40,58,E.out(clamp(lt/1.4)))}deg)`;
  PINS.forEach((p,i)=>{const a=P(lt,.4+i*.12,1.0+i*.12,E.out5);const b=$('bm'+i),l=$('bl'+i);b.style.opacity=a;b.style.transform=`rotateX(-90deg) scaleY(${a})`;l.style.opacity=P(lt,.7+i*.12,1.1+i*.12);l.style.transform=`translateX(-50%) rotateX(-90deg) translateY(${-(185+(i%3)*110)}px)`;});}

 // ---- exploded stack
 const ss=$('stackScene');const sOn=t>12.4&&t<17.4;ss.style.display=sOn?'block':'none';
 if(sOn){const lt=t-12.4;ss.style.opacity=P(t,12.45,13.0)*(1-P(t,16.8,17.3));
  const ex=E.io(clamp((lt-.4)/1.6));
  $('stack').style.transform=`translateY(${lerp(120,0,E.out5(clamp(lt/1.2)))}px) rotateX(${lerp(20,54,E.io(clamp(lt/1.8)))}deg) rotateZ(${lerp(0,-26,E.io(clamp(lt/1.8)))+Math.sin(lt*.5)*2}deg) scale(${lerp(.9,.86,ex)})`;
  const layers=['sl0','sl1','sl2','sc0','sc1','sc2','sc3'];
  layers.forEach((id,i)=>{const el=$(id);let z=i*55*ex;let o=1,sc=1;
   if(id==='sc0'){const hi=E.io(clamp((lt-2.3)/.9));z+=hi*220;sc=1+hi*.06;el.firstElementChild.style.boxShadow=`0 ${30+hi*50}px ${60+hi*60}px rgba(0,0,0,.45),0 0 0 ${hi*4}px rgba(96,165,250,.9)`;}
   else if(i>=3){o=1-.45*E.io(clamp((lt-2.3)/.9));}
   el.style.transform=`translateZ(${z}px) scale(${sc})`;el.style.opacity=o;});}

 // ---- phone
 const Q=track(PK,t);const ph=$('phone');ph.style.display=Q.o>0?'block':'none';
 const qo=t>=33.7?0:Q.o;['phoneFront','phoneBack'].forEach(id=>$(id).style.opacity=qo);ph.style.display=qo>0?'block':'none';ph.style.transform=`translate3d(${Q.x}px,${Q.y}px,${Q.z}px) rotateX(${Q.rx}deg) rotateY(${Q.ry}deg) rotateZ(${Q.rz}deg) scale(${Q.s})`;
 const detail=t>22.35;$('mAI').style.opacity=detail?0:1;$('mDet').style.opacity=detail?1:0;
 glow(540,1080+Q.y*.2,460,'rgba(150,110,255,A)',.18*Q.o);
 // AI chat
 const m1=P(t,18.3,18.6,E.back);$('m1').style.opacity=clamp(m1*2);$('m1').style.transform=`scale(${lerp(.8,1,m1)})`;$('m1').style.transformOrigin='right';
 $('m1t').textContent=USERQ.slice(0,Math.max(1,Math.floor(clamp((t-18.35)/.9)*USERQ.length)));
 $('mdots').style.display=t>19.4&&t<20.1?'block':'none';dts.forEach((d,i)=>d.style.transform=`translateY(${Math.sin(t*11-i)*-3}px)`);
 const m2=P(t,20.1,20.45,E.back);$('m2').style.display=t>20.1?'block':'none';$('m2').style.opacity=clamp(m2*2);$('m2').style.transform=`translateY(${(1-m2)*12}px)`;
 $('m3').style.display=t>20.4?'block':'none';aiLis.forEach((li,i)=>{const q=P(t,20.45+i*.2,20.9+i*.2,E.out5);li.style.opacity=q;li.style.transform=`translateY(${(1-q)*20}px)`;});
 // detail page
 cvis.forEach((c,i)=>{const q=P(t,22.6+i*.15,23.0+i*.15,E.back);c.style.opacity=clamp(q*2);c.style.transform=`scale(${lerp(.7,1,q)})`;});
 const eg=P(t,23.3,23.8,E.out5);$('elig').style.opacity=eg;$('elig').style.transform=`translateY(${(1-eg)*30}px)`;
 const vd=P(t,23.9,24.25,E.back);$('verdict').style.transform=`scale(${lerp(.3,1,vd)})`;$('verdict').style.opacity=clamp(vd*2);
 crows.forEach((r,i)=>{const q=P(t,24.1+i*.2,24.5+i*.2,E.out);r.style.opacity=q;r.style.transform=`translateX(${(1-q)*16}px)`;});

 // ---- end card
 const ec=$('endc');const eOn=t>33.7;ec.style.display=eOn?'flex':'none';
 if(eOn){const lt=t-33.7;const lg=$('endLogo');
  const mb=lg.querySelector('.mb'),band=lg.querySelector('.mband'),board=lg.querySelector('.mboard'),tas=lg.querySelector('.mtas');
  [mb,band,board,tas].forEach(e=>{e.style.transformBox='view-box';});
  const b1=P(lt,.1,.7,E.out5);mb.style.transformOrigin='248px 386px';mb.style.transform=`scaleX(${lerp(.05,1,b1)})`;mb.style.opacity=b1;
  const b2=P(lt,.35,.8,E.out5);band.style.transform=`translateY(${(1-b2)*40}px)`;band.style.opacity=b2;
  const sp=clamp((lt-.5)/1.1);const spr=sp>=1?1:1-Math.exp(-6*sp)*Math.cos(12*sp);board.style.transformOrigin='248px 110px';board.style.transform=`translateY(${(1-spr)*-160}px) rotate(${(1-spr)*-14}deg)`;board.style.opacity=clamp((lt-.5)*5);
  const ts=clamp((lt-.95)/1.4);tas.style.transformOrigin='431px 124px';tas.style.transform=`rotate(${Math.sin(ts*Math.PI*3.2)*16*(1-ts)}deg)`;
  const nm=P(lt,.9,1.7,E.out5);ec.children[1].style.opacity=nm;ec.children[1].style.transform=`translateY(${(1-nm)*24}px)`;ec.children[1].style.letterSpacing=`${lerp(.02,-.04,nm)}em`;
  const u=P(lt,1.5,2.3,E.out5);ec.children[2].style.opacity=u;ec.children[2].style.transform=`translateY(${(1-u)*16}px)`;
  glow(540,900,640,'rgba(60,110,230,A)',.22*P(lt,.2,1.5));}

 // ---- fades to black between acts
 $('black').style.opacity=Math.max(1-P(t,0,.2),P(t,33.3,33.7)*(1-P(t,33.7,34.0)),P(t,36.2,37));
}
