<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ScholarizePath — Devices</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--brand:#0058bd;--ink:#0a1a3f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#eef3fb}
body{font-family:Inter,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:radial-gradient(90% 60% at 50% 45%,#ffffff 0%,#eef4ff 55%,#dfe9fb 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(130px);pointer-events:none}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.abs{position:absolute}
/* ---------- 3D scene */
#scene{position:absolute;inset:0;perspective:2600px;perspective-origin:50% 40%}
#laptop{position:absolute;left:90px;top:660px;width:900px;transform-style:preserve-3d}
#lid{position:relative;width:900px;height:580px;transform-origin:50% 100%;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:30px;backface-visibility:hidden}
#lidFront{background:#0d0f14;padding:22px 22px 26px;box-shadow:inset 0 0 0 2px #2a2e38}
#lidFront .cam{position:absolute;top:8px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:#1f2937;box-shadow:inset 0 0 0 2px #374151}
#screen{position:relative;width:100%;height:100%;border-radius:10px;overflow:hidden;background:#f7f9fc}
#glare{position:absolute;inset:0;border-radius:10px;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 38%,rgba(255,255,255,0) 100%)}
#lidBack{transform:rotateY(180deg);background:linear-gradient(160deg,#e9edf3,#c9d0db);box-shadow:inset 0 0 0 2px #b6bfcc}
#lidBack .apple{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);opacity:.5}
#base{position:relative;width:1000px;margin-left:-50px;height:34px;border-radius:4px 4px 30px 30px;background:linear-gradient(180deg,#e7ebf1 0%,#cfd5de 55%,#aab2bf 100%);box-shadow:0 2px 0 #f5f7fa inset}
#base .notch{position:absolute;left:50%;top:0;width:150px;height:12px;margin-left:-75px;border-radius:0 0 12px 12px;background:#b9c1cc}
#floor{position:absolute;left:140px;top:1250px;width:800px;height:70px;border-radius:50%;background:radial-gradient(closest-side,rgba(10,26,63,.35),rgba(10,26,63,0));filter:blur(8px)}
#phone{position:absolute;left:640px;top:1060px;width:340px;height:700px;transform-style:preserve-3d}
#phoneBody{position:absolute;inset:0;border-radius:58px;background:#0b0c10;padding:13px;box-shadow:inset 0 0 0 3px #3a3f4b,inset 0 0 0 6px #111318, 0 50px 90px rgba(10,26,63,.35)}
#pscreen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;background:#f7f9fc}
#island{position:absolute;top:12px;left:50%;width:100px;height:28px;margin-left:-50px;border-radius:16px;background:#000;z-index:5}
#pglare{position:absolute;inset:0;border-radius:46px;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.25),rgba(255,255,255,0) 40%)}
/* ---------- desktop page (authored at 1440 wide, scaled into the screen) */
#desk{position:absolute;left:0;top:0;width:1440px;transform-origin:0 0}
.nav{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 64px;background:rgba(255,255,255,.85);border-bottom:1px solid rgba(226,232,240,.7)}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font:800 20px 'Plus Jakarta Sans';letter-spacing:-.02em;display:block}.brand small{font:500 8px Inter;display:block;margin-top:2px}
.navr{display:flex;gap:12px;align-items:center;font:500 14px Inter}
.btn{height:40px;display:inline-flex;align-items:center;padding:0 18px;border-radius:10px;font:600 14px Inter}
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#eaf2ff,#f3f7ff 60%,#f7f9fc);padding:80px 64px 96px;display:grid;grid-template-columns:7fr 5fr;gap:40px;align-items:center}
.hero .dots{position:absolute;inset:0;opacity:.35;background-image:radial-gradient(#0058bd 1px,transparent 1px);background-size:24px 24px;-webkit-mask-image:linear-gradient(to bottom,#000,transparent)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid #dbeafe;background:#fff;border-radius:999px;padding:4px 12px;font:600 12px Inter;color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.h1{margin-top:20px;font:700 56px/1.12 'Plus Jakarta Sans';letter-spacing:-.025em;color:var(--ink)}
.gl{background:linear-gradient(90deg,#0058bd,#2f7cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin-top:20px;max-width:576px;font:400 18px/1.6 Inter;color:#475569}
.pc{display:flex;align-items:center;gap:16px;border:1px solid rgba(226,232,240,.8);background:rgba(255,255,255,.95);border-radius:16px;padding:20px;box-shadow:0 12px 28px rgba(10,26,63,.08)}
.pc .ic{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pc .e{font:600 11px Inter;letter-spacing:.08em;text-transform:uppercase;color:#94a3b8}.pc .t{font:600 16px 'Plus Jakarta Sans';margin-top:2px}.pc .p{font:400 14px Inter;color:#64748b;margin-top:2px}
.stats{margin:-32px 64px 0;position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;border:1px solid rgba(226,232,240,.8);background:#fff;border-radius:16px;padding:16px;box-shadow:0 10px 30px rgba(10,26,63,.06)}
.stats li{list-style:none;display:flex;align-items:center;gap:12px;padding:12px}
.stats .ic{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.stats b{display:block;font:700 20px 'Plus Jakarta Sans'}.stats span{font:500 14px Inter;color:#64748b}
.feat{padding:96px 64px}
.feat .ey{font:600 12px Inter;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.feat h2{margin-top:8px;font:700 36px 'Plus Jakarta Sans';letter-spacing:-.02em}
.feat .sub{margin-top:12px;font:400 18px Inter;color:#64748b}
.bento{margin-top:48px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.fc{border:1px solid rgba(226,232,240,.8);background:#fff;border-radius:24px;padding:28px;min-height:250px}
.fc .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.fc .bd{display:inline-block;margin-top:18px;font:600 11px Inter;letter-spacing:.06em;text-transform:uppercase;color:#64748b;background:#f1f5f9;border-radius:999px;padding:4px 10px}
.fc h3{margin-top:12px;font:700 20px 'Plus Jakarta Sans'}.fc p{margin-top:8px;font:400 15px/1.55 Inter;color:#64748b}
/* ---------- mobile page (authored at 390 wide) */
#mob{position:absolute;left:0;top:0;width:390px;transform-origin:0 0}
.mtop{height:104px;padding:52px 18px 0;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.9);border-bottom:1px solid #eef2f7}
.mbody{padding:16px}
.srch{border:1px solid rgba(226,232,240,.8);background:#fff;border-radius:24px;padding:12px}
.srch .row{display:flex;gap:8px}
.srch .in{flex:1;height:44px;border-radius:10px;border:1px solid #e2e8f0;background:#f8fafc;display:flex;align-items:center;gap:8px;padding:0 12px;font:400 14px Inter;color:#94a3b8}
.srch .fb{height:44px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;gap:6px;padding:0 14px;font:600 14px Inter}
.srch .cnt{margin-top:10px;font:400 13px Inter;color:#64748b}
.sc{margin-top:14px;border:1px solid rgba(226,232,240,.8);background:#fff;border-radius:24px;padding:18px;box-shadow:0 4px 12px rgba(10,26,63,.04)}
.fp{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font:600 12px Inter}
.sc h3{margin-top:12px;font:600 18px/1.3 'Plus Jakarta Sans'}.sc .m{margin-top:4px;font:400 14px Inter;color:#64748b}
.sc .am{margin-top:14px;border-radius:16px;background:#f8fafc;padding:12px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:400 13px Inter}
.lv{border:1px solid #e2e8f0;background:#fff;border-radius:6px;padding:2px 8px;font:400 12px Inter;color:#475569}
.vd{margin-top:12px;text-align:right;font:600 14px Inter;color:var(--brand)}
/* captions */
.cap{position:absolute;left:64px;right:64px;top:230px;text-align:center}
.cap .k{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;border-radius:999px;background:#fff;border:2px solid #dbe8ff;font:700 28px Manrope;color:var(--brand);box-shadow:0 8px 24px rgba(0,88,189,.1)}
.cap .h{margin-top:26px;font:800 80px/1.06 Manrope;letter-spacing:-.035em;color:var(--ink)}
</style>
</head>
<body>
<div id="stage">
 <div class="blob" style="width:800px;height:800px;background:#93c5fd;opacity:.45;left:-300px;top:500px"></div>
 <div class="blob" style="width:700px;height:700px;background:#fcd34d;opacity:.25;right:-280px;top:1100px"></div>
 <div class="cap" id="cap"><div class="k" id="capk"></div><div class="h" id="caph"></div></div>
 <div id="floor"></div>
 <div id="scene">
  <div id="laptop">
   <div id="lid">
    <div class="face" id="lidFront"><div class="cam"></div><div id="screen"><div id="desk"></div><div id="glare"></div></div></div>
    <div class="face" id="lidBack"><div class="apple" id="backlogo"></div></div>
   </div>
   <div id="base"><div class="notch"></div></div>

 </div>
</div>
<script>
const LANG=new URLSearchParams(location.search).get('lang')==='en'?'en':'ru';
const CAP={ru:['ScholarizePath','Твой путь —<br><span class="gl">на любом экране</span>'],en:['ScholarizePath','Your path —<br><span class="gl">on every screen</span>']}[LANG];
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,x)=>a+(b-a)*x;
const E={out:x=>1-Math.pow(1-x,3),out5:x=>1-Math.pow(1-x,5),inOut:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
 inOutQ:x=>x<.5?8*x*x*x*x:1-Math.pow(-2*x+2,4)/2,back:x=>{const c1=1.3,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)}};
const P=(t,a,b,e=E.out)=>t<=a?0:t>=b?1:e((t-a)/(b-a));
const I={cap:'<path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/><path d="M22 10v6"/><path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>',
 award:'<path d="m15.477 12.89 1.515 8.526a.5.5 0 0 1-.81.47l-3.58-2.687a1 1 0 0 0-1.197 0l-3.586 2.686a.5.5 0 0 1-.81-.469l1.514-8.526"/><circle cx="12" cy="8" r="6"/>',
 bot:'<path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/>',
 trend:'<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',sl:'<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>',
 file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m9 15 2 2 4-4"/>',
 pin:'<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
 arrow:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>',
 search:'<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',coins:'<circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/>',
 heart:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
 cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'};
const ic=(k,s=24,c='currentColor',w=1.9)=>`<svg class="i" width="${s}" height="${s}" viewBox="0 0 24 24" style="color:${c};stroke-width:${w}">${I[k]}</svg>`;
const MARK=(w,fill='#0058bd')=>`<svg viewBox="0 0 498 386" width="${w}" height="${Math.round(w*386/498)}" fill="${fill}"><path d="M18 290 C120 294 200 318 244 350 L248 386 C205 356 110 322 15 322 L8 294 Z"/><path d="M42 263 C135 268 205 302 244 346 L240 352 C200 305 120 283 29 277 Z"/><g transform="translate(497 0) scale(-1 1)"><path d="M18 290 C120 294 200 318 244 350 L248 386 C205 356 110 322 15 322 L8 294 Z"/><path d="M42 263 C135 268 205 302 244 346 L240 352 C200 305 120 283 29 277 Z"/></g><path d="M112 166 L248 221 L386 164 L386 248 Q298 258 249 310 Q200 258 112 248 Z"/><path d="M249 0 L495 101 L248 206 L2 101 Z"/><rect x="426" y="120" width="11" height="68" rx="3"/><circle cx="431" cy="195" r="12"/><path d="M422 207 L440 207 L445 236 L443 241 L420 241 L417 236 Z"/></svg>`;
$('capk').innerHTML=MARK(34)+CAP[0];$('caph').innerHTML=CAP[1];
$('backlogo').innerHTML=MARK(120,'#9aa5b5');

// ---------- desktop home page (mirrors app/page.tsx)
const FEATURES=[['cap','1500+ Institutions','Global Universities','Explore over 1,500 top-ranked universities worldwide tailored to your academic profile.','#eff6ff','#2563eb',2],
 ['award','120+ Grants','Scholarship Finder','Discover fully funded and partial scholarships matching your target field and criteria.','#fffbeb','#d97706',1],
 ['bot','AI Powered','Smart Assistant','Leverage interactive AI tools to streamline, draft, and automate your entire application process.','#f5f3ff','#7c3aed',1],
 ['sl','Algorithmic','List Generator','Generate highly curated university lists matched precisely to your budget and preferences.','#f0f9ff','#0284c7',1],
 ['file','Requirements','Admissions Details','Access complete admissions criteria, required document checklists, and key deadlines.','#fff1f2','#e11d48',1],
 ['trend','Analytics','Personalized Odds','Evaluate your target programs with an algorithmic estimate of your acceptance chances.','#ecfdf5','#059669',2]];
$('desk').innerHTML=`
<div class="nav"><div class="brand">${MARK(40)}<div><b>ScholarizePath</b><small>Your Pathway to Global Education</small></div></div>
 <div class="navr"><span style="color:#475569">Rankings</span><span class="btn">Sign In</span><span class="btn" style="background:#0058bd;color:#fff">Sign Up</span></div></div>
<section class="hero"><div class="dots"></div>
 <div style="position:relative"><span class="pill">${ic('spark',14,'#f59e0b')}Universities · Scholarships · AI tools</span>
  <div class="h1">Find your best fit: <span class="gl">explore global opportunities</span></div>
  <p class="lead">Explore 1,500+ universities and 120+ scholarships, get AI help with your applications, and see your personalized admission odds — all in one place.</p>
  <div style="margin-top:32px;display:flex;gap:12px"><span class="btn" style="height:48px;padding:0 24px;font-size:15px;background:#0058bd;color:#fff;box-shadow:0 8px 20px rgba(0,88,189,.25);gap:8px">Get started ${ic('arrow',16,'#fff',2.2)}</span><span class="btn" style="height:48px;padding:0 24px;font-size:15px;background:#fff;border:1px solid #e2e8f0">Explore features</span></div></div>
 <div style="position:relative;display:flex;flex-direction:column;gap:16px;max-width:448px;margin:0 auto;width:100%">
  <p style="display:flex;align-items:center;gap:8px;font:600 12px Inter;letter-spacing:.08em;text-transform:uppercase;color:#64748b"><i style="width:8px;height:8px;border-radius:50%;background:#10b981;display:inline-block"></i>Most favorited right now</p>
  <div class="pc" style="transform:rotate(-1deg)"><span class="ic" style="background:#eff6ff;color:#0058bd">${ic('cap',24)}</span><span style="flex:1"><span class="e">University</span><div class="t">University of Buenos Aires (UBA)</div><div class="p">${ic('pin',14,'#94a3b8')} Buenos Aires, Argentina</div></span>${ic('arrow',16,'#cbd5e1')}</div>
  <div class="pc" style="transform:translateX(24px) rotate(1deg)"><span class="ic" style="background:#fffbeb;color:#d97706">${ic('award',24)}</span><span style="flex:1"><span class="e">Scholarship</span><div class="t">Stipendium Hungaricum</div><div class="p">${ic('pin',14,'#94a3b8')} Hungary</div></span>${ic('arrow',16,'#cbd5e1')}</div>
 </div></section>
<ul class="stats">${[['cap','1,500+','Universities','#eff6ff','#0058bd'],['award','120+','Scholarships','#fffbeb','#d97706'],['bot','AI','Application assistant','#f5f3ff','#7c3aed'],['trend','Odds','Personalized estimates','#ecfdf5','#059669']].map(s=>`<li><span class="ic" style="background:${s[3]};color:${s[4]}">${ic(s[0],24)}</span><span><b>${s[1]}</b><span>${s[2]}</span></span></li>`).join('')}</ul>
<section class="feat"><div class="ey">Platform features</div><h2>Everything you need to apply abroad</h2><p class="sub">Data-driven insights, AI automation, and curated scholarship matching — tap any card to learn more.</p>
 <div class="bento">${FEATURES.map(f=>`<div class="fc" style="grid-column:span ${f[6]}"><div class="ic" style="background:${f[4]};color:${f[5]}">${ic(f[0],24)}</div><span class="bd">${f[1]}</span><h3>${f[2]}</h3><p>${f[3]}</p></div>`).join('')}</div></section>`;

// ---------- mobile scholarships page (mirrors Scholarships.tsx card), real rows from scripts/db/batches
const SCH=[['Stipendium Hungaricum Scholarship','Hungary','🇭🇺',["Bachelor's","Master's",'PhD']],['ETH Zurich Excellence Scholarship & Opportunity Programme (ESOP)','Switzerland','🇨🇭',["Master's"]],
 ['Government of Ireland International Education Scholarship (GOI-IES)','Ireland','🇮🇪',["Master's",'PhD']],['Hong Kong PhD Fellowship Scheme (HKPFS)','Hong Kong','🇭🇰',['PhD']],['TaiwanICDF International Higher Education Scholarship','Taiwan','🇹🇼',["Bachelor's","Master's",'PhD']]];
$('mob').innerHTML=`<div class="mtop"><div class="brand">${MARK(30)}<b style="font-size:17px">ScholarizePath</b></div><div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#2f7cf6,#0058bd);color:#fff;display:flex;align-items:center;justify-content:center;font:800 15px Manrope">A</div></div>
<div class="mbody"><div style="font:700 26px 'Plus Jakarta Sans';margin:4px 2px 14px">Scholarships</div>
 <div class="srch"><div class="row"><div class="in">${ic('search',16,'#94a3b8')}Search scholarships…</div><div class="fb">${ic('sl',16,'#fff')}Filters</div></div><div class="cnt">Showing <b style="color:#0a1a3f">1–10</b> of <b style="color:#0a1a3f">120</b> scholarships</div></div>
 ${SCH.map(s=>`<div class="sc"><div style="display:flex;justify-content:space-between;align-items:flex-start"><span class="fp" style="background:#ecfdf5;color:#047857"><i style="width:6px;height:6px;border-radius:50%;background:#10b981;display:inline-block"></i>Fully Funded</span><span style="color:#cbd5e1" class="hrt">${ic('heart',22)}</span></div>
  <h3>${s[0]}</h3><div class="m">${s[1]} ${s[2]}</div><div class="am"><span style="display:inline-flex;gap:6px;align-items:center">${ic('coins',16,'#0058bd')}<i style="color:#64748b">See official website</i></span>${s[3].map(l=>`<span class="lv">${l}</span>`).join('')}</div>
  <div class="vd">View details →</div></div>`).join('')}</div>`;

// sizes
const SW=856,SH=532; // laptop screen inner size (900-44 by 580-48)
const dk=$('desk');const dScale=SW/1440;dk.style.transform=`scale(${dScale})`;
const mScale=(340-26)/390;$('mob').style.transform=`scale(${mScale})`;
const hearts=[...document.querySelectorAll('.hrt')];

function render(t){
 // caption
 const c=P(t,0.25,0.95,E.out5);$('cap').style.opacity=c;$('cap').style.transform=`translateY(${(1-c)*40}px)`;$('cap').style.filter=`blur(${(1-c)*10}px)`;
 // laptop: rise, open, orbit
 const rise=P(t,0,1.1,E.out5);const open=P(t,0.7,2.1,E.inOutQ);
 const orbit=lerp(-24,8,E.inOut(clamp(t/6.5)));const tilt=lerp(14,6,E.inOut(clamp(t/6.5)));
 const lap=$('laptop');
 const shift=P(t,3.2,4.4,E.inOut);
 lap.style.transform=`translate3d(${-shift*70}px,${(1-rise)*380 - shift*40}px,0) rotateX(${tilt}deg) rotateY(${orbit}deg) scale(${lerp(.9,1,rise)*lerp(1,.92,shift)})`;
 lap.style.opacity=clamp(rise*1.5);
 $('lid').style.transform=`rotateX(${lerp(89,0,open)}deg)`;
 $('screen').style.filter=`brightness(${lerp(.15,1,P(t,1.4,2.2))})`;
 $('glare').style.opacity=.6+.4*Math.sin(orbit*D2R*3);
